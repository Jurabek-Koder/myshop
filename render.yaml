# ================================================================
# MyShop — Render Blueprint
# GitHub repoga ulang: Dashboard → New → Blueprint → shu repo
# Keyin faqat 2 ta env ni to'ldiring (quyida izoh bor)
# ================================================================

services:

  # ── Redis (AI qo'ng'iroq navbati) ──────────────────────────────
  - type: redis
    name: myshop-redis
    plan: free
    region: frankfurt
    ipAllowList: []

  # ── Backend: Express API + SQLite ──────────────────────────────
  - type: web
    name: myshop-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    # Persistent Disk — SQLite ma'lumotlari saqlanadi ($7/oy)
    # Bepul ishlatmoqchi bo'lsangiz bu 3 qatorni o'chirib tashlang
    # (lekin deploy/restart da DB o'chib ketadi!)
    disk:
      name: myshop-db
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tashkent

      # SQLite va uploads Persistent Disk da saqlanadi
      - key: DB_DIR
        value: /data
      - key: UPLOADS_DIR
        value: /data

      # JWT — Render avtomatik yaratadi (o'zgartirmang)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Redis — myshop-redis dan avtomatik olinadi
      - key: REDIS_URL
        fromService:
          name: myshop-redis
          type: redis
          property: connectionString

      # !! SIZ TO'LDIRING: frontend URL (myshop-web servis manzili)
      # Masalan: https://myshop-web.onrender.com
      # Render da myshop-api → Environment → CORS_ORIGINS
      - key: CORS_ORIGINS
        sync: false

      # Ixtiyoriy: AI qo'ng'iroq
      - key: MYSHOP_VAPI_TOKEN
        sync: false
      - key: MYSHOP_AI_TRANSCRIPTS_AES_KEY
        sync: false

  # ── Frontend: Vite → CDN ───────────────────────────────────────
  - type: web
    name: myshop-web
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # !! SIZ TO'LDIRING: backend URL (myshop-api servis manzili)
      # Masalan: https://myshop-api.onrender.com
      # Render da myshop-web → Environment → VITE_API_BASE_URL
      - key: VITE_API_BASE_URL
        sync: false
