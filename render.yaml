# =============================================================================
# Render Blueprint — production: ma'lumotlar YO‘QOLMASIN / doimiy disk
# -----------------------------------------------------------------------------
# SQLite + yuklashlar FAQAT Persistent Disk ustida yozilganda deploy/restart
# dan keyin ham qoladi. Ephemeral («vaqtinchalik») diskda yozsangiz — ma’lumot
# uyqu/deploy bilan yo‘qoladi (ChatGPT nimani «Supabase qo‘sh» deb aytgani).
#
# ShARTLAR (Render dokumentatsiyasi):
#   • Persistent Disk — faqat toʻlangan Web Service da (starter va yuqori).
#   • Free Web Service ga disk Qo‘shy Olmaysiz va servis ishlamagan paytda uyqu-
#     ga kiradi (~15 daq) — uyquni toʻliq OʻCHirish Free da Render imkoni bermaydi;
#     doim ishlab turishi uchun toʻlangan rejimga chiqish kerak yoki boshqa host.
#
# Qo‘lda sozlash ham bo‘lishi mumkin:
#   Dashboard → Web Service → Disks → Add (masalan name: myshop-data,
#   mountPath: /var/data/myshop) → Env: MYSHOP_DATA_DIR=/var/data/myshop
# Production da MYSHOP_ALLOW_EPHEMERAL_DISK=1 QOYMANG — xavfli demo rejim.
#
# Frontend alohida domen boʻlsa → API env: CORS_ORIGINS=https://frontend-....onrender.com yoki FRONTEND_URL.
# CORS_ORIGINS boʻsh va Render prod bo‘lsa, avtomatik https://*.onrender.com ruxsat (yumshoq); qattiqlashtirish:
# CORS_ORIGINS yoki MYSHOP_CORS_TRUST_ONRENDER=0.
# =============================================================================

databases: []

services:
  # =============================================================================
  # BACKEND — API xizmati. Nomi "myshop-api" — bu loyihaning eski hujjati
  # (README-RENDER-UCHUN.txt) va sizning haqiqiy production URL'ingiz
  # (https://myshop-api-4pvv.onrender.com) bilan tasdiqlangan.
  # =============================================================================
  - type: web
    name: myshop-api
    runtime: node
    # Doimiy disk uchun Free emas — production uchun Starter+ kerak:
    plan: starter
    region: frankfurt

    disk:
      name: myshop-sqlite
      mountPath: /var/data/myshop
      sizeGB: 1

    # Alohida static frontend: builddan oldin frontend/.env.production ga
    # VITE_API_BASE_URL=https://<backend-host>.onrender.com
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && NODE_ENV=production node src/server.js
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tashkent
      # SQLite + uploads shu yerda → restart/deploy dan keyin ham saqlanadi:
      - key: MYSHOP_DATA_DIR
        value: /var/data/myshop
      # Frontend alohida static xizmat sifatida joylashtirilsa (pastdagi
      # myshop-frontend), API bu domendan CORS so'rovlarini qabul qilishi
      # uchun ruxsat berilgan manzillar ro'yxati. Capacitor mobil ilova ham
      # shu ro'yxatga muhtoj (https://localhost — Android, capacitor://localhost — iOS).
      - key: CORS_ORIGINS
        value: https://myshop-frontend-xsa5.onrender.com,https://localhost,capacitor://localhost
      # XAVFSIZLIK: quyidagi ikkalasi HAM Render Dashboard → Environment
      # panelida QO'LDA, kuchli tasodifiy qiymat bilan o'rnatilishi SHART.
      # `sync: false` — bu qiymatlar YAML/Git orqali emas, faqat Dashboard
      # orqali qo'yiladi (shu sabab tasodifan Git'ga tushib qolmaydi).
      # Kod ichida standart (ochiq) qiymat bor — shuni ALMASHTIRISH kerak,
      # aks holda ilova hammaga ma'lum kalit bilan ishlaydi.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Ixtiyoriy bulut aks (mahsulot + rollar): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY —
      # loyihangiz Secrets orqali; SQL jadvallari: repodagi supabase/migrations/
      # Sukut: kalit mavjud bo‘lsa avto-sync yoqiladi. O‘chirish: SUPABASE_MIRROR_SYNC_ENABLED=0
    # PORT — Render beradi.

  # =============================================================================
  # FRONTEND — alohida Static Site (production'da haqiqatan ishlatilmoqda:
  # https://myshop-frontend-xsa5.onrender.com). SPA (React Router) uchun
  # "/*" → "/index.html" rewrite qoidasi SHART, aks holda "/login", "/seller"
  # kabi yo'llarda "Refresh" qilganda 404 chiqadi.
  # =============================================================================
  - type: web
    name: myshop-frontend
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Backend alohida domenda bo'lgani uchun frontend build vaqtida
      # to'liq (absolute) API manzilini bilishi kerak — yuqoridagi backend
      # xizmatining HAQIQIY production URL'iga mos kelishi SHART.
      - key: VITE_API_BASE_URL
        value: https://myshop-api-4pvv.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Eslatma: agar kelajakda backend o'zi frontend/dist'ni bitta domendan
    # bersa (yuqoridagi "myshop" xizmati), bu alohida "myshop-frontend"
    # xizmatiga ehtiyoj qolmaydi — lekin ikkalasi parallel ishlashi ham
    # xavfsiz (ikkalasi bir xil backendga ulanadi).
